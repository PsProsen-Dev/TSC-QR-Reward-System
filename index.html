<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSC QR Reward System - Select Your Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FFD700;
            margin-bottom: 2rem;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .store-card {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #333;
            padding: 2rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
            text-decoration: none;
            display: block;
        }
        
        .store-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
            background: linear-gradient(45deg, #FFA500, #FF8C00);
        }
        
        .store-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .store-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .store-code {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 600;
        }
        
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 1s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 2s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .container {
                padding: 1.5rem;
                margin: 1rem;
            }
            
            .store-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
        
        /* Developer Credits Footer */
        .dev-credits {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #FFD700;
            z-index: 1000;
        }
        
        .dev-credits a {
            color: #FFD700;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .dev-credits a:hover {
            color: #FFA500;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container">
        <img src="tsc-logo.jpg" alt="TSC Logo" class="logo">
        <h1>🏪 TSC Reward System</h1>
        <p class="subtitle">
            Welcome to The Shankar Communications QR Reward System.<br>
            Select your store location to get started!
        </p>
        
        <div class="store-grid">
            <a href="./welcome-complete.html?store=MNG" class="store-card">
                <div class="store-icon">🏪</div>
                <div class="store-name">Maynaguri</div>
                <div class="store-code">Store Code: MNG</div>
            </a>
            
            <a href="./welcome-complete.html?store=DPG" class="store-card">
                <div class="store-icon">🏪</div>
                <div class="store-name">Dhupguri</div>
                <div class="store-code">Store Code: DPG</div>
            </a>
            
            <a href="./welcome-complete.html?store=JMD" class="store-card">
                <div class="store-icon">🏪</div>
                <div class="store-name">Jamaldaha</div>
                <div class="store-code">Store Code: JMD</div>
            </a>
        </div>
    </div>
    
    <script>
        // Check if store parameter is provided in URL
        const urlParams = new URLSearchParams(window.location.search);
        const store = urlParams.get('store');
        
        if (store && ['MNG', 'DPG', 'JMD'].includes(store.toUpperCase())) {
            // If valid store parameter exists, redirect to welcome page
            window.location.href = `./welcome-complete.html?store=${store.toUpperCase()}`;
        }
        
        // Add click tracking for store cards
        document.querySelectorAll('.store-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const store = this.href.split('store=')[1];
                console.log(`Redirecting to store: ${store}`);
                
                // Store the selection in localStorage for consistency
                localStorage.setItem('selectedStore', store);
            });
        });
        
        // Add entrance animation to container
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            container.style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
    
    <!-- Developer Credits Footer -->
    <footer class="dev-credits">
        <p>Crafted by <a href="https://psprosen.me" target="_blank">Ps Prosen</a> | Powered by <a href="https://we-digital-mitra.tech" target="_blank">WDM</a></p>
    </footer>
</body>
</html>
