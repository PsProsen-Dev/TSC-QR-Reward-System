    <div class="container">
        <img src="tsc-logo.jpg" alt="The Shankar Communications (TSC) Logo" class="logo" width="512" height="512" fetchpriority="high">

        <p class="subtitle">Your reward is just one spin away!</p>
        
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <svg class="wheel" id="wheelSvg" viewBox="0 0 300 300">
                <!-- Wheel segments will be drawn here -->
            </svg>
            <div class="wheel-center">SPIN</div>
        </div>
        
        <button class="spin-button" id="spinBtn" onclick="spinWheel()">
            <i class="fas fa-star"></i> SPIN NOW
        </button>
        
        <div class="loading" id="loading">
            Processing your reward<span class="dot1">.</span><span class="dot2">.</span><span class="dot3">.</span>
        </div>
        
        <div class="result" id="result">
            <h3 id="resultTitle">🎉 Congratulations!</h3>
            <p id="resultText">You won: <span class="prize-value" id="prizeText"></span></p>
            <a href="claim-reward.html" class="continue-btn" id="continueBtn" style="display: none;">
                <i class="fas fa-arrow-right"></i> Claim Your Reward
            </a>
        </div>
    </div>
    
    <script>
        // Prevent duplicate spins
        let hasSpun = localStorage.getItem('tsc_has_spun') === 'true';
        
        // Add reset function for debugging
        function resetSpin() {
            localStorage.removeItem('tsc_has_spun');
            localStorage.removeItem('tsc_spin_result');
            location.reload();
        }
        
        // Debugging: Add reset option (remove in production)
        if (window.location.search.includes('reset=1')) {
            resetSpin();
        }
        
        // Prize segments with different weights
        const prizes = [
            { 
                text: '1 Tempered Glass', 
                color: 'url(#gradient1)', 
                weight: 25,
                image: './tempred-glass.png'
            },
            { 
                text: '1 Mobile Stand', 
                color: 'url(#gradient2)', 
                weight: 25,
                image: './mobile-stand.png'
            },
            { 
                text: '1 Tempered Glass + 1 Mobile Stand', 
                color: 'url(#gradient3)', 
                weight: 20,
                image: './tempred-glass.png',
                isCombo: true,
                comboImages: ['./tempred-glass.png', './mobile-stand.png']
            },
            { 
                text: '1 Wire Earphone', 
                color: 'url(#gradient4)', 
                weight: 30,
                image: './headphone.webp'
            }
        ];
        
        // Draw the wheel
        function drawWheel() {
            const svg = document.getElementById('wheelSvg');
            const centerX = 150;
            const centerY = 150;
            const radius = 140;
            const anglePerSegment = 360 / prizes.length;
            
            svg.innerHTML = ''; // Clear existing content
            
            // Add premium gradients and effects
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            
            // Premium gradient definitions
            const gradients = [
                { id: 'gradient1', colors: ['#FFD700', '#FF8C00', '#FFD700'], shadow: '#FFD700' },
                { id: 'gradient2', colors: ['#00CED1', '#1E90FF', '#00CED1'], shadow: '#00CED1' },
                { id: 'gradient3', colors: ['#FF69B4', '#8A2BE2', '#FF69B4'], shadow: '#FF69B4' },
                { id: 'gradient4', colors: ['#32CD32', '#228B22', '#32CD32'], shadow: '#32CD32' }
            ];
            
            gradients.forEach(grad => {
                const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
                gradient.setAttribute('id', grad.id);
                gradient.setAttribute('cx', '50%');
                gradient.setAttribute('cy', '30%');
                gradient.setAttribute('r', '70%');
                
                const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop1.setAttribute('offset', '0%');
                stop1.setAttribute('stop-color', grad.colors[0]);
                stop1.setAttribute('stop-opacity', '0.9');
                
                const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop2.setAttribute('offset', '50%');
                stop2.setAttribute('stop-color', grad.colors[1]);
                stop2.setAttribute('stop-opacity', '0.8');
                
                const stop3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop3.setAttribute('offset', '100%');
                stop3.setAttribute('stop-color', grad.colors[2]);
                stop3.setAttribute('stop-opacity', '0.7');
                
                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                gradient.appendChild(stop3);
                defs.appendChild(gradient);
                
                // Add glow filter
                const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                filter.setAttribute('id', `glow${grad.id.slice(-1)}`);
                filter.setAttribute('x', '-50%');
                filter.setAttribute('y', '-50%');
                filter.setAttribute('width', '200%');
                filter.setAttribute('height', '200%');
                
                const feMorphology = document.createElementNS('http://www.w3.org/2000/svg', 'feMorphology');
                feMorphology.setAttribute('operator', 'dilate');
                feMorphology.setAttribute('radius', '2');
                feMorphology.setAttribute('in', 'SourceAlpha');
                feMorphology.setAttribute('result', 'thicken');
                
                const feGaussianBlur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
                feGaussianBlur.setAttribute('in', 'thicken');
                feGaussianBlur.setAttribute('stdDeviation', '3');
                feGaussianBlur.setAttribute('result', 'colored');
                
                const feFlood = document.createElementNS('http://www.w3.org/2000/svg', 'feFlood');
                feFlood.setAttribute('flood-color', grad.shadow);
                feFlood.setAttribute('flood-opacity', '0.8');
                
                const feComposite = document.createElementNS('http://www.w3.org/2000/svg', 'feComposite');
                feComposite.setAttribute('in', 'colored');
                feComposite.setAttribute('in2', 'SourceGraphic');
                feComposite.setAttribute('operator', 'over');
                
                filter.appendChild(feMorphology);
                filter.appendChild(feGaussianBlur);
                filter.appendChild(feFlood);
                filter.appendChild(feComposite);
                defs.appendChild(filter);
            });
            
            svg.appendChild(defs);
            
            prizes.forEach((prize, index) => {
                const startAngle = index * anglePerSegment;
                const endAngle = (index + 1) * anglePerSegment;
                
                // Convert to radians
                const startRad = (startAngle - 90) * (Math.PI / 180);
                const endRad = (endAngle - 90) * (Math.PI / 180);
                
                // Calculate path points
                const x1 = centerX + radius * Math.cos(startRad);
                const y1 = centerY + radius * Math.sin(startRad);
                const x2 = centerX + radius * Math.cos(endRad);
                const y2 = centerY + radius * Math.sin(endRad);
                
                const largeArcFlag = anglePerSegment > 180 ? 1 : 0;
                
                const pathData = [
                    `M ${centerX} ${centerY}`,
                    `L ${x1} ${y1}`,
                    `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                    'Z'
                ].join(' ');
                
                // Create segment path with premium effects
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', prize.color);
                path.setAttribute('stroke', '#FFD700');
                path.setAttribute('stroke-width', '3');
                path.setAttribute('filter', `url(#glow${index + 1})`);
                path.setAttribute('opacity', '0.95');
                path.style.transition = 'all 0.3s ease';
                svg.appendChild(path);
                
                // Add inner shadow effect
                const shadowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                shadowPath.setAttribute('d', pathData);
                shadowPath.setAttribute('fill', 'none');
                shadowPath.setAttribute('stroke', 'rgba(0,0,0,0.3)');
                shadowPath.setAttribute('stroke-width', '1');
                shadowPath.setAttribute('opacity', '0.6');
                svg.appendChild(shadowPath);
                
                // Calculate positions for image and text
                const textAngle = startAngle + anglePerSegment / 2;
                const textRad = (textAngle - 90) * (Math.PI / 180);
                
                // Add premium image with effects if available
                if (prize.image) {
                    const imageRadius = radius * 0.45;
                    const imageX = centerX + imageRadius * Math.cos(textRad);
                    const imageY = centerY + imageRadius * Math.sin(textRad);
                    
                    // Create image container with premium styling
                    const imageGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    
                    // Check if this is a combo item with multiple images
                    if (prize.isCombo && prize.comboImages) {
                        // For combo items, show both images side by side
                        prize.comboImages.forEach((comboImg, imgIndex) => {
                            const offsetX = imgIndex === 0 ? -15 : 15; // Position images left and right
                            const comboImageX = imageX + offsetX;
                            
                            // Add background circle for each combo image
                            const imageBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                            imageBg.setAttribute('cx', comboImageX);
                            imageBg.setAttribute('cy', imageY);
                            imageBg.setAttribute('r', '20');
                            imageBg.setAttribute('fill', 'rgba(255,255,255,0.9)');
                            imageBg.setAttribute('stroke', '#FFD700');
                            imageBg.setAttribute('stroke-width', '2');
                            imageBg.setAttribute('filter', 'drop-shadow(0 4px 8px rgba(0,0,0,0.3))');
                            imageGroup.appendChild(imageBg);
                            
                            // Create clipPath for circular combo image
                            const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
                            clipPath.setAttribute('id', `comboClip${index}_${imgIndex}`);
                            const clipCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                            clipCircle.setAttribute('cx', comboImageX);
                            clipCircle.setAttribute('cy', imageY);
                            clipCircle.setAttribute('r', '18');
                            clipPath.appendChild(clipCircle);
                            defs.appendChild(clipPath);
                            
                            const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                            image.setAttribute('x', comboImageX - 18);
                            image.setAttribute('y', imageY - 18);
                            image.setAttribute('width', '36');
                            image.setAttribute('height', '36');
                            image.setAttribute('href', comboImg);
                            image.setAttribute('clip-path', `url(#comboClip${index}_${imgIndex})`);
                            image.setAttribute('transform', `rotate(${textAngle}, ${comboImageX}, ${imageY})`);
                            imageGroup.appendChild(image);
                        });
                        
                        // Add "+" symbol between combo images
                        const plusText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        plusText.setAttribute('x', imageX);
                        plusText.setAttribute('y', imageY + 25);
                        plusText.setAttribute('text-anchor', 'middle');
                        plusText.setAttribute('dominant-baseline', 'middle');
                        plusText.setAttribute('fill', '#FFD700');
                        plusText.setAttribute('font-family', 'Poppins');
                        plusText.setAttribute('font-size', '12');
                        plusText.setAttribute('font-weight', '900');
                        plusText.setAttribute('stroke', '#000');
                        plusText.setAttribute('stroke-width', '0.5');
                        plusText.setAttribute('filter', 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))');
                        plusText.setAttribute('transform', `rotate(${textAngle}, ${imageX}, ${imageY + 25})`);
                        plusText.textContent = '+';
                        imageGroup.appendChild(plusText);
                    } else {
                        // Single image display (existing code)
                        // Add background circle for image
                        const imageBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        imageBg.setAttribute('cx', imageX);
                        imageBg.setAttribute('cy', imageY);
                        imageBg.setAttribute('r', '28');
                        imageBg.setAttribute('fill', 'rgba(255,255,255,0.9)');
                        imageBg.setAttribute('stroke', '#FFD700');
                        imageBg.setAttribute('stroke-width', '2');
                        imageBg.setAttribute('filter', 'drop-shadow(0 4px 8px rgba(0,0,0,0.3))');
                        imageGroup.appendChild(imageBg);
                        
                        // Create clipPath for circular image
                        const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
                        clipPath.setAttribute('id', `clip${index}`);
                        const clipCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        clipCircle.setAttribute('cx', imageX);
                        clipCircle.setAttribute('cy', imageY);
                        clipCircle.setAttribute('r', '24');
                        clipPath.appendChild(clipCircle);
                        defs.appendChild(clipPath);
                        
                        const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                        image.setAttribute('x', imageX - 24);
                        image.setAttribute('y', imageY - 24);
                        image.setAttribute('width', '48');
                        image.setAttribute('height', '48');
                        image.setAttribute('href', prize.image);
                        image.setAttribute('clip-path', `url(#clip${index})`);
                        image.setAttribute('transform', `rotate(${textAngle}, ${imageX}, ${imageY})`);
                        imageGroup.appendChild(image);
                    }
                    
                    svg.appendChild(imageGroup);
                    
                    // Position premium text below image with smart wrapping
                    const textRadius = radius * 0.88;
                    const textX = centerX + textRadius * Math.cos(textRad);
                    const textY = centerY + textRadius * Math.sin(textRad);
                    
                    // Smart text handling for different lengths
                    const maxCharsPerLine = 12;
                    let lines = [];
                    
                    // Check if text already has line breaks
                    if (prize.text.includes('\n')) {
                        lines = prize.text.split('\n');
                    } else {
                        // Auto-break long text
                        const words = prize.text.split(/[\s\+]/);
                        let currentLine = '';
                        
                        words.forEach(word => {
                            if ((currentLine + word).length <= maxCharsPerLine) {
                                currentLine += (currentLine ? ' ' : '') + word;
                            } else {
                                if (currentLine) lines.push(currentLine);
                                currentLine = word;
                            }
                        });
                        if (currentLine) lines.push(currentLine);
                    }
                    
                    // Create text lines with proper spacing
                    lines.forEach((line, lineIndex) => {
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        const lineY = textY + (lineIndex - (lines.length - 1) / 2) * 8;
                        
                        text.setAttribute('x', textX);
                        text.setAttribute('y', lineY);
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('dominant-baseline', 'middle');
                        text.setAttribute('fill', '#FFFFFF');
                        text.setAttribute('font-family', 'Poppins');
                        text.setAttribute('font-size', lines.length > 1 ? '7' : '8');
                        text.setAttribute('font-weight', '700');
                        text.setAttribute('stroke', '#000');
                        text.setAttribute('stroke-width', '0.3');
                        text.setAttribute('filter', 'drop-shadow(0 1px 2px rgba(0,0,0,0.8))');
                        text.setAttribute('transform', `rotate(${textAngle}, ${textX}, ${lineY})`);
                        text.textContent = line;
                        svg.appendChild(text);
                    });
                } else {
                    // Premium text styling for no image with smart wrapping
                    const textRadius = radius * 0.7;
                    const textX = centerX + textRadius * Math.cos(textRad);
                    const textY = centerY + textRadius * Math.sin(textRad);
                    
                    // Smart text handling for different lengths
                    const maxCharsPerLine = 10;
                    const words = prize.text.split(/[\s\+\-]/);
                    const lines = [];
                    let currentLine = '';
                    
                    words.forEach(word => {
                        if ((currentLine + word).length <= maxCharsPerLine) {
                            currentLine += (currentLine ? ' ' : '') + word;
                        } else {
                            if (currentLine) lines.push(currentLine);
                            currentLine = word;
                        }
                    });
                    if (currentLine) lines.push(currentLine);
                    
                    // Create text lines with proper spacing
                    lines.forEach((line, lineIndex) => {
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        const lineY = textY + (lineIndex - (lines.length - 1) / 2) * 10;
                        
                        text.setAttribute('x', textX);
                        text.setAttribute('y', lineY);
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('dominant-baseline', 'middle');
                        text.setAttribute('fill', '#FFFFFF');
                        text.setAttribute('font-family', 'Poppins');
                        text.setAttribute('font-size', lines.length > 1 ? '9' : '11');
                        text.setAttribute('font-weight', '700');
                        text.setAttribute('stroke', '#000');
                        text.setAttribute('stroke-width', '0.5');
                        text.setAttribute('filter', 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))');
                        text.setAttribute('transform', `rotate(${textAngle}, ${textX}, ${lineY})`);
                        text.textContent = line;
                        svg.appendChild(text);
                    });
                }
            });
        }
        
        // Weighted random selection
        function getRandomPrize() {
            const totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let i = 0; i < prizes.length; i++) {
                if (random < prizes[i].weight) {
                    return { prize: prizes[i], index: i };
                }
                random -= prizes[i].weight;
            }
            
            return { prize: prizes[0], index: 0 }; // fallback
        }
        
        // Spin wheel function
        function spinWheel() {
            if (hasSpun) {
                alert('🎯 You have already completed the spin! Each user gets only one chance.');
                return;
            }
            
            const wheel = document.getElementById('wheelSvg');
            const spinBtn = document.getElementById('spinBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // Disable button and show loading
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SPINNING...';
            loading.classList.add('show');
            wheel.classList.add('spinning');
            
            // Get random prize
            const { prize, index } = getRandomPrize();
            
            // Calculate rotation
            const segmentAngle = 360 / prizes.length;
            const targetAngle = (index * segmentAngle) + (segmentAngle / 2);
            const randomSpins = Math.floor(Math.random() * 5) + 5; // 5-10 full rotations
            const finalRotation = (randomSpins * 360) + (360 - targetAngle);
            
            // Apply rotation
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            
            // Show result after animation
            setTimeout(() => {
                loading.classList.remove('show');
                wheel.classList.remove('spinning');
                
                // Store the result
                localStorage.setItem('tsc_spin_result', prize.text);
                localStorage.setItem('tsc_has_spun', 'true');
                hasSpun = true;
                
                // Display result
                document.getElementById('prizeText').textContent = prize.text;
                document.getElementById('continueBtn').style.display = 'inline-block';
                result.classList.add('show');
                
                // Update button
                spinBtn.innerHTML = '<i class="fas fa-check"></i> COMPLETED';
                
                // Confetti effect
                createConfetti();
                
            }, 4500);
        }
        
        // Confetti effect
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1'][Math.floor(Math.random() * 4)];
                    confetti.style.zIndex = '1000';
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.animation = 'confetti-fall 3s linear forwards';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 50);
            }
        }
        
        // Add confetti animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confetti-fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Initialize wheel on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Read store code from localStorage
            const storeCode = localStorage.getItem('tsc_store_code');
            if (storeCode) {
                console.log('Operating for store:', storeCode);
                // Store code will be used in token generation
                localStorage.setItem('tsc_current_store', storeCode);
            }
            
            // Debug localStorage values
            console.log('Has spun:', localStorage.getItem('tsc_has_spun'));
            console.log('Spin result:', localStorage.getItem('tsc_spin_result'));
            
            drawWheel();
            
            // Check if already spun
            if (hasSpun) {
                const spinBtn = document.getElementById('spinBtn');
                const result = document.getElementById('result');
                const savedResult = localStorage.getItem('tsc_spin_result');
                
                spinBtn.disabled = true;
                spinBtn.innerHTML = '<i class="fas fa-check"></i> COMPLETED';
                
                if (savedResult) {
                    console.log('Displaying result:', savedResult);
                    document.getElementById('prizeText').textContent = savedResult;
                    document.getElementById('continueBtn').style.display = 'inline-block';
                    result.classList.add('show');
                }
            }
        });
        
        // Prevent back button after spinning
        if (hasSpun) {
            history.pushState(null, null, location.href);
            window.onpopstate = function() {
                history.go(1);
            };
        }
    </script>
