<!-- Add these meta tags to <head> section of ALL HTML files -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFD700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSC Rewards">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<!-- iOS Safe Area Support -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA Support (Optional) -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./tsc-logo.jpg">

<!-- Universal Mobile CSS Override -->
<style>
/* Critical Mobile-First CSS - Add this to every HTML file */
@media (max-width: 480px) {
    html, body {
        overflow-x: hidden !important;
        width: 100% !important;
        max-width: 100vw !important;
    }
    
    body {
        padding: 5px !important;
        padding-top: 10px !important;
        padding-bottom: 60px !important;
        font-size: 16px !important; /* Prevents iOS zoom */
    }
    
    .container {
        max-width: calc(100vw - 10px) !important;
        padding: 15px 12px !important;
        margin: 2px !important;
        border-radius: 15px !important;
    }
    
    /* Touch-friendly buttons */
    button, .btn, .option-button, .task-btn, .store-btn {
        min-height: 44px !important;
        min-width: 44px !important;
        padding: 12px 20px !important;
        font-size: 14px !important;
        border-radius: 25px !important;
        touch-action: manipulation !important;
        -webkit-tap-highlight-color: rgba(255, 215, 0, 0.3) !important;
    }
    
    /* Responsive typography */
    h1 { font-size: 1.4rem !important; line-height: 1.3 !important; }
    h2 { font-size: 1.2rem !important; line-height: 1.3 !important; }
    h3 { font-size: 1rem !important; line-height: 1.3 !important; }
    p, .subtitle { font-size: 12px !important; line-height: 1.4 !important; }
    
    /* Images and logos */
    .logo, .header-logo {
        width: 50px !important;
        height: 50px !important;
        margin-bottom: 10px !important;
    }
    
    /* Form elements */
    input, textarea, select {
        font-size: 16px !important; /* Prevents iOS zoom */
        padding: 12px 15px !important;
        border-radius: 10px !important;
        width: 100% !important;
    }
    
    /* Modal optimization */
    .modal-content {
        max-width: 95% !important;
        padding: 20px 15px !important;
        margin: 10px !important;
        border-radius: 15px !important;
    }
    
    /* Grid layouts become single column */
    .grid, .offers-grid, .tasks-grid {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
    }
}

/* Landscape mode optimization */
@media (max-height: 600px) and (orientation: landscape) {
    body {
        padding: 5px !important;
        padding-bottom: 50px !important;
    }
    
    .container {
        padding: 10px 15px !important;
        max-height: calc(100vh - 60px) !important;
        overflow-y: auto !important;
    }
    
    .logo, .header-logo {
        width: 40px !important;
        height: 40px !important;
    }
    
    h1 { font-size: 1.2rem !important; }
    h2 { font-size: 1rem !important; }
    p { font-size: 11px !important; }
}

/* Safe area support for newer iPhones */
@supports (padding: max(0px)) {
    body {
        padding-left: max(5px, env(safe-area-inset-left)) !important;
        padding-right: max(5px, env(safe-area-inset-right)) !important;
        padding-bottom: max(60px, env(safe-area-inset-bottom)) !important;
    }
}
</style>
